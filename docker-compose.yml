version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend

  backend:
    build: ./backend/digitalnalaravel
    container_name: laravel_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend/digitalnalaravel:/var/www
      - /var/www/vendor
    working_dir: /var/www
    depends_on:
      - db
    command: >
      sh -c "
      if [ ! -f .env ]; then cp .env.example .env; fi &&
      php artisan key:generate --force &&
      echo '⏳ Waiting for MySQL...' &&
      until nc -z db 3306; do
        sleep 2;
      done &&
      echo '✅ MySQL is ready!' &&
      php artisan migrate --force &&
      php artisan db:seed --force &&
      php artisan storage:link &&
      php artisan serve --host=0.0.0.0 --port=8000
      "


  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
