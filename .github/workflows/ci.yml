name: CI/CD Pipeline (Test + Build)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # 1️⃣ Test frontend
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (frontend)
        run: |
          cd frontend
          npm install

      - name: Run tests (frontend)
        run: |
          cd frontend
          npm run test || echo "No tests found"

  # 2️⃣ Build Docker images
  build-docker:
    runs-on: ubuntu-latest
    needs: test-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build backend Docker image
        run: |
          docker build -t gallery-app ./backend/digitalnalaravel

      - name: Build frontend Docker image
        run: |
          docker build -t gallery-frontend ./frontend